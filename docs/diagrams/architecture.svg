<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="860" viewBox="0 0 1700 860"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><rect width="1700" height="860" fill="#FFFFFF"/><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#1F3864" text-anchor="middle" dominant-baseline="middle"><tspan x="850.0" y="38.0">Identité utilisateur de bout en bout : myID (Keycloak) → BFF → Agent Foundry → MCP</tspan></text><rect x="40" y="80" width="900" height="96" rx="14" fill="#FFF4E5" stroke="#E8710A" stroke-width="2.5"/><text font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#B45309" text-anchor="middle" dominant-baseline="middle"><tspan x="490" y="110.0">myID = Keycloak · realm « weather »</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="normal" fill="#5F2B00" text-anchor="middle" dominant-baseline="middle"><tspan x="490" y="145.0">Clients : weather-mobile (public, PKCE) · weather-bff (confidentiel, token exchange) · weather-mcp (audience) · JWKS</tspan></text><rect x="1010" y="80" width="420" height="96" rx="14" fill="#E6F4EA" stroke="#188038" stroke-width="2.5"/><text font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#188038" text-anchor="middle" dominant-baseline="middle"><tspan x="1220" y="110.0">Microsoft Entra ID</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="normal" fill="#0D3B1E" text-anchor="middle" dominant-baseline="middle"><tspan x="1220" y="145.0">identité managée dédiée du BFF uniquement</tspan></text><rect x="40" y="330" width="290" height="300" rx="14" fill="#FFFFFF" stroke="#D93025" stroke-width="2.5"/><text font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#D93025" text-anchor="middle" dominant-baseline="middle"><tspan x="185.0" y="360.0">App web / mobile</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="normal" fill="#5F6368" text-anchor="middle" dominant-baseline="middle"><tspan x="185.0" y="386.0">client public weather-mobile</tspan></text><line x1="58" y1="406" x2="312" y2="406" stroke="#E0E3E7" stroke-width="1.5"/><text font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#202124" text-anchor="start" dominant-baseline="middle"><tspan x="62" y="432.0">✓  Login OIDC + PKCE</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#202124" text-anchor="start" dominant-baseline="middle"><tspan x="62" y="459.0">✓  Jeton A uniquement</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#202124" text-anchor="start" dominant-baseline="middle"><tspan x="62" y="486.0">✓  Aucun secret embarqué</tspan></text><rect x="400" y="330" width="380" height="300" rx="14" fill="#FFFFFF" stroke="#188038" stroke-width="2.5"/><text font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#188038" text-anchor="middle" dominant-baseline="middle"><tspan x="590.0" y="360.0">BFF · API « chat »</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="normal" fill="#5F6368" text-anchor="middle" dominant-baseline="middle"><tspan x="590.0" y="386.0">API Management (apim) ou Python (code)</tspan></text><line x1="418" y1="406" x2="762" y2="406" stroke="#E0E3E7" stroke-width="1.5"/><text font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#202124" text-anchor="start" dominant-baseline="middle"><tspan x="422" y="432.0">✓  Refus des en-têtes d&#x27;identité</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#202124" text-anchor="start" dominant-baseline="middle"><tspan x="422" y="459.0">✓  Validation de A (aud, azp, exp)</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#202124" text-anchor="start" dominant-baseline="middle"><tspan x="422" y="486.0">✓  Échange A → B (OBO) + cache</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#202124" text-anchor="start" dominant-baseline="middle"><tspan x="422" y="513.0">✓  Validation de B (aud, azp, sub)</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#202124" text-anchor="start" dominant-baseline="middle"><tspan x="422" y="540.0">✓  Corps en liste blanche, CORS</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#202124" text-anchor="start" dominant-baseline="middle"><tspan x="422" y="567.0">✓  Session dérivée de l&#x27;identité</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#202124" text-anchor="start" dominant-baseline="middle"><tspan x="422" y="594.0">✓  Limites par IP et par utilisateur</tspan></text><rect x="850" y="330" width="380" height="300" rx="14" fill="#FFFFFF" stroke="#1A73E8" stroke-width="2.5"/><text font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#1A73E8" text-anchor="middle" dominant-baseline="middle"><tspan x="1040.0" y="360.0">Agent hébergé Foundry</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="normal" fill="#5F6368" text-anchor="middle" dominant-baseline="middle"><tspan x="1040.0" y="386.0">Agent Framework · weather-agent</tspan></text><line x1="868" y1="406" x2="1212" y2="406" stroke="#E0E3E7" stroke-width="1.5"/><text font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#202124" text-anchor="start" dominant-baseline="middle"><tspan x="872" y="432.0">✓  Passerelle : RBAC + impersonation</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#202124" text-anchor="start" dominant-baseline="middle"><tspan x="872" y="459.0">✓  Conversations isolées par utilisateur</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#202124" text-anchor="start" dominant-baseline="middle"><tspan x="872" y="486.0">✓  Pré-contrôle de B (sinon 401)</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#202124" text-anchor="start" dominant-baseline="middle"><tspan x="872" y="513.0">✓  B lié à la requête, jamais au modèle</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#202124" text-anchor="start" dominant-baseline="middle"><tspan x="872" y="540.0">✓  Outils MCP définis dans le code</tspan></text><rect x="1300" y="330" width="360" height="300" rx="14" fill="#FFFFFF" stroke="#8430CE" stroke-width="2.5"/><text font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#8430CE" text-anchor="middle" dominant-baseline="middle"><tspan x="1480.0" y="360.0">Serveur MCP météo</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="normal" fill="#5F6368" text-anchor="middle" dominant-baseline="middle"><tspan x="1480.0" y="386.0">resource server weather-mcp</tspan></text><line x1="1318" y1="406" x2="1642" y2="406" stroke="#E0E3E7" stroke-width="1.5"/><text font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#202124" text-anchor="start" dominant-baseline="middle"><tspan x="1322" y="432.0">✓  Valide B (signature, iss, aud)</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#202124" text-anchor="start" dominant-baseline="middle"><tspan x="1322" y="459.0">✓  azp = weather-bff (sinon 401)</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#202124" text-anchor="start" dominant-baseline="middle"><tspan x="1322" y="486.0">✓  Scope vérifié par outil</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#202124" text-anchor="start" dominant-baseline="middle"><tspan x="1322" y="513.0">✓  Utilisateur = claim sub</tspan></text><line x1="330" y1="370" x2="400" y2="370" stroke="#1A73E8" stroke-width="3" marker-end="url(#arr)"/><circle cx="365" cy="344" r="15" fill="#202124"/><text font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle"><tspan x="365" y="345.0">2</tspan></text><line x1="780" y1="370" x2="850" y2="370" stroke="#188038" stroke-width="3" marker-end="url(#arr)"/><circle cx="815" cy="344" r="15" fill="#202124"/><text font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle"><tspan x="815" y="345.0">5</tspan></text><line x1="1230" y1="370" x2="1300" y2="370" stroke="#8430CE" stroke-width="3" marker-end="url(#arr)"/><circle cx="1265" cy="344" r="15" fill="#202124"/><text font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle"><tspan x="1265" y="345.0">6</tspan></text><line x1="185" y1="330" x2="185" y2="176" stroke="#E8710A" stroke-width="3" marker-end="url(#arr)" marker-start="url(#arr)"/><circle cx="185" cy="253" r="15" fill="#E8710A"/><text font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle"><tspan x="185" y="254.0">1</tspan></text><line x1="520" y1="330" x2="520" y2="176" stroke="#8430CE" stroke-width="3" marker-end="url(#arr)" marker-start="url(#arr)"/><circle cx="520" cy="253" r="15" fill="#8430CE"/><text font-family="Arial, Helvetica, sans-serif" font-size="1