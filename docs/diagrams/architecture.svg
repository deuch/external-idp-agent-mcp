ther-mcp, azp = weather-bff, même sub</tspan></text><circle cx="870" cy="748" r="15" fill="#188038"/><text font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle"><tspan x="870" y="749.0">4</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="normal" fill="#202124" text-anchor="start" dominant-baseline="middle"><tspan x="898" y="749.0">Le BFF obtient le jeton Entra E de son identité managée dédiée</tspan></text><circle cx="70" cy="796" r="15" fill="#188038"/><text font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle"><tspan x="70" y="797.0">5</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="normal" fill="#202124" text-anchor="start" dominant-baseline="middle"><tspan x="98" y="797.0">BFF → Agent : Bearer E · x-ms-user-identity · x-client-mcp-token: B · session dérivée</tspan></text><circle cx="870" cy="796" r="15" fill="#8430CE"/><text font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle"><tspan x="870" y="797.0">6</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="normal" fill="#202124" text-anchor="start" dominant-baseline="middle"><tspan x="898" y="797.0">Agent → MCP : Authorization: Bearer B</tspan></text></svg>