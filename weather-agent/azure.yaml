# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
    azd: '>=1.27.1'
    extensions:
        azure.ai.agents: '>=1.0.0-beta.9'
name: weather-agent
services:
    ai-project:
        host: azure.ai.project
        deployments:
            - model:
                format: OpenAI
                name: gpt-5.4-mini
                version: "2026-03-17"
              name: gpt-5.4-mini
              sku:
                capacity: 10
                name: GlobalStandard
    weather-agent:
        project: src/weather-agent
        host: azure.ai.agent
        language: python
        uses:
            - ai-project
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
            # Set by deploy.ps1 from the platform deployment outputs (Keycloak realm + MCP server).
            MCP_SERVER_URL: ${MCP_SERVER_URL}
            MCP_TOKEN_HEADER: x-client-mcp-token
            OIDC_ISSUER: ${OIDC_ISSUER}
            OIDC_JWKS_URI: ${OIDC_JWKS_URI}
            MCP_AUDIENCE: ${MCP_AUDIENCE}
        codeConfiguration:
            dependencyResolution: remote_build
            entryPoint: main.py
            runtime: python_3_13
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        description: Weather chat agent calling a user-authenticated MCP server with the Keycloak (myID) token obtained by the BFF (OBO token exchange).
        kind: hosted
        name: weather-agent
        protocols:
            - protocol: responses
              version: 2.0.0
infra:
    provider: microsoft.foundry
